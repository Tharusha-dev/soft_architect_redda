<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusEnroll | Modern University Enrolment</title>
    
    <!-- SEO and Meta tags -->
    <meta name="description" content="NexusEnroll is a modern, responsive university enrolment system for students, instructure, and administrators.">
    <meta name="theme-color" content="#0f172a">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Container -->
    <div id="login-container" class="login-container">
        <div class="login-card">
            <h2 class="text-center" style="color: var(--primary); margin-bottom: 0.25rem;">NexusEnroll</h2>
            <p class="text-center" style="color: #64748b; font-size: 0.875rem; margin-bottom: 2rem;">University Course Enrolment System</p>
            
            <h3 style="color: var(--primary); margin-bottom: 1rem;">Sign in as</h3>
            
            <div class="role-radios" style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                <label><input type="radio" name="loginRole" value="student" checked onchange="updateLoginDropdown()"> Student</label>
                <label><input type="radio" name="loginRole" value="instructure" onchange="updateLoginDropdown()"> Faculty</label>
                <label><input type="radio" name="loginRole" value="admin" onchange="updateLoginDropdown()"> Administrator</label>
            </div>
            
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label style="display: block; font-size: 0.875rem; color: #475569; margin-bottom: 0.5rem;">Choose an existing account</label>
                <select id="login-user-select" class="form-control" style="width: 100%; padding: 0.5rem; margin-bottom: 0.5rem;"></select>
                <button class="btn btn-primary" style="width: 100%;" onclick="performLogin()">Log In</button>
            </div>
            
        </div>
    </div>

    <!-- App Container -->
    <div class="app-container" id="app-container" style="display: none;">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <h1>NexusEnroll</h1>
                </div>
            </div>



            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- Navigation items dynamically injected by JS based on role -->
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar" id="user-avatar">S</div>
                    <div class="user-info">
                        <span class="user-name" id="user-name">Alex Johnson</span>
                        <span class="user-id" id="user-id">ID: 20261011</span>
                    </div>
                </div>
                <button class="logout-btn" onclick="performLogout()">
                    <i class="fa-solid fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <h2 id="page-title">Dashboard</h2>
                <div class="header-actions">
                    <button class="btn btn-secondary" onclick="showNotifications()">🔔 Notifications</button>
                </div>
            </header>

            <!-- Dynamic Views Container -->
            <div class="view-container" id="view-container">
                <!-- Content injected by JS -->
            </div>
        </main>
    </div>

    <!-- Notification Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
