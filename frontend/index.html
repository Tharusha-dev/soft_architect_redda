<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusEnroll | Modern University Enrolment</title>
    
    <!-- SEO and Meta tags -->
    <meta name="description" content="NexusEnroll is a modern, responsive university enrolment system for students, instructure, and administrators.">
    <meta name="theme-color" content="#0f172a">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Container -->
    <div id="login-container" class="login-container">
        <div class="login-card">
            <div class="login-logo-wrapper">
                <div class="login-logo">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h2>Welcome to NexusEnroll</h2>
                <p>University Course Enrolment System</p>
            </div>
            
            <div class="role-selector-container">
                <h3>
                    <i class="fa-solid fa-user-shield"></i> Select Role
                </h3>
                <div class="role-radios">
                    <label class="role-option">
                        <input type="radio" name="loginRole" value="student" checked onchange="updateLoginDropdown()">
                        <span class="role-badge">Student</span>
                    </label>
                    <label class="role-option">
                        <input type="radio" name="loginRole" value="instructure" onchange="updateLoginDropdown()">
                        <span class="role-badge">Faculty</span>
                    </label>
                    <label class="role-option">
                        <input type="radio" name="loginRole" value="admin" onchange="updateLoginDropdown()">
                        <span class="role-badge">Admin</span>
                    </label>
                </div>
            </div>
            
            <div class="form-group login-form-group">
                <label>Choose Account</label>
                <div class="select-wrapper">
                    <select id="login-user-select" class="form-control"></select>
                    <i class="fa-solid fa-chevron-down select-icon"></i>
                </div>
            </div>
            
            <button class="btn btn-primary login-btn" onclick="performLogin()">
                Access Portal <i class="fa-solid fa-arrow-right"></i>
            </button>
            
        </div>
    </div>

    <!-- App Container -->
    <div class="app-container" id="app-container" style="display: none;">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <h1>NexusEnroll</h1>
                </div>
            </div>



            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- Navigation items dynamically injected by JS based on role -->
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar" id="user-avatar">S</div>
                    <div class="user-info">
                        <span class="user-name" id="user-name">Alex Johnson</span>
                        <span class="user-id" id="user-id">ID: 20261011</span>
                    </div>
                </div>
                <button class="logout-btn" onclick="performLogout()">
                    <i class="fa-solid fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <h2 id="page-title">Dashboard</h2>
                <div class="header-actions">
                    <button class="btn btn-secondary" onclick="showNotifications()">🔔 Notifications</button>
                </div>
            </header>

            <!-- Dynamic Views Container -->
            <div class="view-container" id="view-container">
                <!-- Content injected by JS -->
            </div>
        </main>
    </div>

    <!-- Notification Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
